# The production Blueprint intentionally contains only the Free web service.
# Paid workers and cron jobs must be provisioned separately when explicitly approved.
services:
  - type: web
    name: eagleeyes-api
    runtime: python
    # Keep the live validation on Free (512 MB). The application-level
    # Research budget and single-flight bound remain mandatory.
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health/readiness
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ASK_DAG_CONCURRENCY
        value: "3"
      - key: ASK_TOOL_BUDGET_SECONDS
        value: "20"
      # Research is single-flight until the bounded path is verified against
      # real Render RSS. This does not serialize Ask.
      - key: RESEARCH_CORE_CONCURRENCY
        value: "1"
      - key: RESEARCH_CORE_CACHE_MAX_ENTRIES
        value: "2"
      - key: RESEARCH_OVERVIEW_CACHE_MAX_ENTRIES
        value: "2"
      - key: RESEARCH_OVERVIEW_CONCURRENCY
        value: "1"
      - key: RESEARCH_CORE_CACHE_TTL_SECONDS
        value: "300"
      - key: RESEARCH_CORE_MEMORY_BUDGET_MB
        value: "192"
      - key: ASK_ROUTER_V2
        value: "1"
      - key: ASK_CAPABILITY_PLANNER_GEMINI
        value: "0"
      - key: ASK_GEMINI_ENRICHMENT
        value: "0"
      - key: HEAVY_ANALYTICS_ENABLED
        value: "1"
      - key: SIMULATION_ENABLED
        value: "1"
      - key: OPTIMIZER_ENABLED
        value: "1"
      - key: BACKTESTING_ENABLED
        value: "1"
      - key: DEEP_COMPANY_RESEARCH_ENABLED
        value: "1"
      - key: PREDICTION_MARKET_ENRICHMENT_ENABLED
        value: "1"
      - key: CONVERSATIONAL_DASHBOARDS_ENABLED
        value: "1"
      - key: MAX_ACTIVE_ANALYTICAL_JOBS_PER_USER
        value: "4"
      - key: RATE_LIMIT_REQUESTS_PER_MINUTE
        value: "60"
      - key: MAX_REQUEST_BYTES
        value: "1048576"
      - key: APP_ENV
        value: "production"
      - key: SENTRY_DSN
        sync: false
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: POLYGON_API_KEY
        sync: false
      - key: TIINGO_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: SEC_USER_AGENT
        sync: false
