name: Refresh prediction markets

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: investment-dashboard-market-ingestion
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - run: python -m backend.ingestion refresh --providers markets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
