name: Owner self-test read-model maintenance

on:
  schedule:
    - cron: "5 5 * * *"
  workflow_dispatch:

concurrency:
  group: eagleeyes-owner-self-test-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  maintain:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Reconcile persisted read models
        run: python scripts/reconcile_read_models.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
