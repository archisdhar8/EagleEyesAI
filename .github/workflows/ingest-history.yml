name: Extend historical model data

on:
  schedule:
    - cron: "15 4 1 * *"
  workflow_dispatch:

concurrency:
  group: investment-dashboard-history-ingestion
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - run: python -m backend.ingestion history --providers polygon,alfred,regimes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
